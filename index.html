<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
:root{
  --side:#20353a; --side-2:#182a2e; --side-line:rgba(255,255,255,.08);
  --bg:#f3f1ea; --panel:#ffffff;
  --accent:#2f5d54; --accent-dark:#244a43; --accent-soft:#e5ede9;
  --danger:#b5544a; --danger-soft:#f4e3e1; --warn:#b98a2e; --warn-soft:#f6ecd6;
  --line:#e3ddd0; --line-soft:#efeae0;
  --ink:#2b2b28; --muted:#8a877d;
  --radius:6px; --serif:'Playfair Display',Georgia,serif;
  --sel:#fbf3d9; --sel-b:#e0c877;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13.5px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none!important}

/* buttons */
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 18px;border-radius:22px;
  font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.sec{background:#fff;color:var(--accent);border-color:var(--line)}
.btn.sec:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.danger:hover{filter:brightness(.94)}
.btn.sm{padding:5px 14px;font-size:12.5px;font-weight:600}
.btn-block{width:100%;justify-content:center;padding:11px}
.icon-btn{border:none;background:transparent;padding:4px 7px;border-radius:6px;font-size:15px;line-height:1}
.icon-btn:hover{background:var(--accent-soft)}

/* ---------- GATE (login/register) ---------- */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#20353a,#2f5d54)}
.gate-card{width:430px;max-width:100%;background:#fff;border-radius:14px;padding:34px 34px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.30)}
.gate-logo{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:30px;background:var(--accent-soft);color:var(--accent)}
.gate-title{text-align:center;font-family:var(--serif);font-size:23px;font-weight:700;color:var(--side)}
.gate-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:5px 0 20px}
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:var(--side)}
.field input{width:100%}
.gate-err{color:var(--danger);font-size:12.5px;min-height:17px;margin-top:9px;text-align:center}
.gate-switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px}
.gate-hint{margin-top:12px;text-align:center;font-size:11.5px;color:var(--muted)}

/* ---------- APP SHELL (sidebar + main) ---------- */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--side);color:#cdd8d6;
  display:flex;flex-direction:column;z-index:30}
.side-brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.side-brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.side-brand .bt{font-family:var(--serif);font-weight:700;font-size:19px;color:#fff;line-height:1}
.side-brand .bs{font-size:11px;color:#93a7a2;margin-top:3px}
.side-user{display:flex;align-items:center;gap:10px;margin:0 14px 8px;padding:11px 12px;
  background:rgba(255,255,255,.05);border-radius:10px}
.side-user .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase;flex:0 0 auto}
.side-user .su-name{font-size:12.5px;color:#fff;font-weight:600;word-break:break-word;line-height:1.2}
.side-user .su-role{font-size:10.5px;color:#8fa4a0;margin-top:2px}
.side-nav{flex:1;overflow:auto;padding:6px 12px 12px}
.nav-sec{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:#7f9490;margin:14px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#cdd8d6;
  font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);text-decoration:none;color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item .ni{width:20px;text-align:center;font-size:15px}
.side-logout{margin:8px 14px 16px;padding:10px;background:transparent;color:#cdd8d6;border:1px solid var(--side-line);
  border-radius:9px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.side-logout:hover{background:rgba(255,255,255,.06);color:#fff}

.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;
  display:flex;align-items:center;padding:0 26px;gap:14px}
.tb-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:16px}
.tb-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--side);margin:0}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.ws-badge{font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:20px;font-weight:600}
.content{flex:1;padding:24px 26px 60px}
.view{display:block}
.scrim{display:none}

/* ---------- HOME ---------- */
.home{}
.home-hero{background:linear-gradient(120deg,#2f5d54,#20353a);color:#fff;border-radius:14px;padding:24px 26px;margin-bottom:22px}
.home-hero h2{font-family:var(--serif);margin:0 0 4px;font-size:24px}
.home-hero p{margin:0;opacity:.85;font-size:13px}
.home-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .lb{font-size:12px;color:var(--muted)}
.stat .vl{font-size:22px;font-weight:700;margin-top:6px;font-family:var(--serif)}
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;
  cursor:pointer;transition:.14s;display:flex;align-items:center;gap:14px}
.tile:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(47,93,84,.12);transform:translateY(-1px)}
.tile.accent{background:var(--accent-soft);border-color:var(--accent-soft)}
.tile.dim{opacity:.5;pointer-events:none}
.tile .emoji{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.tile.accent .emoji{background:#fff}
.tile .t{font-weight:600;font-size:13.5px}

/* ---------- PANEL / SECTION ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.panel-head{padding:14px 20px;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;
  font-size:16px;color:var(--side);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-sub{font-size:12px;color:var(--muted);font-weight:400;font-family:'Inter',sans-serif}
.box{background:#fff}

.filterbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line-soft);background:#faf8f2}
.filterbar label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;color:var(--side);font-size:13px}
.filterbar .rng{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}

/* voucher entry */
.entry{display:grid;grid-template-columns:1.1fr 1.1fr 1.4fr auto;gap:12px 18px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-weight:600;color:var(--side);font-size:12px}
.fld .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{width:100%}
.fld.row{flex-direction:row;align-items:flex-end;gap:7px}
.add-inline{border:1px solid var(--line);background:#fff;color:var(--accent);width:38px;height:38px;border-radius:var(--radius);
  font-size:18px;font-weight:700;flex:0 0 auto}
.add-inline:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.entry-actions{display:flex;flex-direction:column;justify-content:flex-start;gap:9px}

/* tables */
.tbl-wrap{overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{background:#faf8f2;border-bottom:1px solid var(--line);padding:11px 16px;text-align:left;
  color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.4px;font-weight:600;white-space:nowrap;position:sticky;top:0}
table.grid td{border-bottom:1px solid var(--line-soft);padding:11px 16px;vertical-align:middle}
table.grid tbody tr:hover{background:#faf8f2}
table.grid tbody tr.sel{background:var(--sel)!important;box-shadow:inset 3px 0 0 var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--danger);font-weight:600}
.pos{color:var(--accent);font-weight:600}
.center{text-align:center}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.totbar{display:flex;gap:28px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);
  background:#faf8f2;font-weight:600;color:var(--side);font-size:13.5px}

/* master-detail */
.md{display:grid;grid-template-columns:1fr 350px}
.md .list{border-right:1px solid var(--line);overflow:auto}
.md .detail{padding:16px 18px;overflow:auto;background:#faf8f2}
.md .detail h3{margin:0 0 12px;color:var(--side);font-size:14px;font-family:var(--serif)}
.detail .fld{margin-bottom:10px}
.detail-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}

.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;max-width:760px}
.form2 .full{grid-column:1/-1}

/* toast + modal */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;
  background:var(--side);color:#fff;padding:11px 20px;border-radius:10px;z-index:100;transition:.25s;
  box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--accent)}#toast.err{background:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(32,53,58,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:440px;max-width:100%;overflow:hidden}
.modal-h{padding:16px 20px;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--side);border-bottom:1px solid var(--line)}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;display:flex;justify-content:flex-end;gap:9px;background:#faf8f2;border-top:1px solid var(--line)}

@media(max-width:880px){
  .sidebar{transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #app.nav-open .sidebar{transform:none}
  #app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .main{margin-left:0}
  .tb-menu{display:block}
  .home-cards{grid-template-columns:repeat(2,1fr)}
  .home-grid{grid-template-columns:repeat(2,1fr)}
  .entry{grid-template-columns:1fr}
  .md{grid-template-columns:1fr}
  .md .detail{border-top:1px solid var(--line)}
  .form2{grid-template-columns:1fr}
}

<script>
"use strict";
/* =====================================================================
   SDH – Quản lý Thu Chi  (single-file web app, chạy trên GitHub Pages)
   ===================================================================== */

/* ---------------- Data layer (Firebase Firestore hoặc localStorage) ---------------- */
const KEY='sdh_data_v1';
let DB=null, SES=null;
const CLOUD = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && typeof firebase!=='undefined');
const WORKSPACE_ID = window.WORKSPACE_ID || 'sdh-default';
const fb = {auth:null, db:null, ref:null, unsub:null, shown:false, saveT:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function load(){ /* chỉ dùng cho chế độ LƯU MÁY */
  try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB){DB=seedData();saveLocal()}
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Không lưu được (bộ nhớ trình duyệt bị chặn)','err')}}

/* save() – gọi ở mọi nơi sau khi thay đổi dữ liệu */
function save(){
  if(CLOUD){
    if(!fb.ref)return;
    clearTimeout(fb.saveT);
    fb.saveT=setTimeout(()=>{
      fb.ref.set(normalizeDB(DB)).catch(e=>toast('Lỗi lưu Firebase: '+(e.message||e),'err'));
    },200);
  }else{
    saveLocal();
  }
}
function normalizeDB(d){
  d=d||{};const base=seedData();
  return {
    users:Array.isArray(d.users)?d.users:[],
    funds:Array.isArray(d.funds)?d.funds:base.funds,
    objects:Array.isArray(d.objects)?d.objects:[],
    incomeCat:Array.isArray(d.incomeCat)?d.incomeCat:base.incomeCat,
    expenseCat:Array.isArray(d.expenseCat)?d.expenseCat:base.expenseCat,
    receipts:Array.isArray(d.receipts)?d.receipts:[],
    payments:Array.isArray(d.payments)?d.payments:[],
    company:d.company||base.company
  };
}
/* map lỗi Firebase Auth sang tiếng Việt */
function fbErr(e){
  const c=(e&&e.code)||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return 'Sai email hoặc mật khẩu.';
  if(c.includes('invalid-email'))return 'Email không hợp lệ.';
  if(c.includes('too-many-requests'))return 'Thử quá nhiều lần, vui lòng đợi rồi thử lại.';
  if(c.includes('network'))return 'Lỗi mạng. Kiểm tra kết nối Internet.';
  return (e&&e.message)||'Đăng nhập thất bại.';
}

/* ---------------- Utilities ---------------- */
function fmtMoney(n){n=Number(n)||0;return n.toLocaleString('vi-VN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtMoney2(n){n=Number(n)||0;return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseMoney(s){if(typeof s==='number')return s;const neg=/^\s*-/.test(String(s));const n=Number(String(s).replace(/[^\d]/g,''))||0;return neg?-n:n}
function pad(n,l){return String(n).padStart(l,'0')}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function nowStamp(){const d=new Date();return d.toISOString()}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return iso;return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()}
function fmtDateTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return iso;
  return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()+' '+pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)+':'+pad(d.getSeconds(),2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600)}
function confirmBox(msg){return window.confirm(msg)}

/* auto voucher number: PREFIX-MMYYnnn (nnn = số thứ tự trong tháng) */
function nextVoucherNo(prefix,list,dateISO){
  const d=new Date(dateISO||todayISO());
  const mm=pad(d.getMonth()+1,2), yy=pad(d.getFullYear()%100,2);
  const p=mm+yy;
  let max=0;
  list.forEach(v=>{const m=(v.code||'').match(new RegExp('^'+prefix+'\\s*-\\s*'+p+'(\\d{3,})$'));
    if(m){const n=parseInt(m[1],10);if(n>max)max=n}});
  return prefix+' - '+p+pad(max+1,3);
}

/* fund balance calc */
function fundStats(fundId){
  const inc=DB.receipts.filter(r=>r.fundId===fundId).reduce((s,r)=>s+Number(r.amount||0),0);
  const exp=DB.payments.filter(p=>p.fundId===fundId).reduce((s,p)=>s+Number(p.amount||0),0);
  const f=DB.funds.find(f=>f.id===fundId)||{initialAmount:0};
  return {inc,exp,remain:Number(f.initialAmount||0)+inc-exp};
}

/* ----- Firebase: khởi tạo, quan sát đăng nhập, đồng bộ realtime ----- */
function initCloud(){
  try{firebase.initializeApp(window.FIREBASE_CONFIG);}
  catch(e){console.error(e);toast('Cấu hình Firebase lỗi: '+e.message,'err');return;}
  fb.auth=firebase.auth();
  fb.db=firebase.firestore();
  fb.auth.onAuthStateChanged(user=>{
    if(user){
      SES={username:user.email,fullName:user.displayName||user.email,email:user.email,uid:user.uid};
      startCloudSync();
    }else{
      SES=null;fb.shown=false;
      if(fb.unsub){fb.unsub();fb.unsub=null;}
      backToLogin();
    }
  });
}
function startCloudSync(){
  fb.ref=fb.db.collection('workspaces').doc(WORKSPACE_ID);
  if(fb.unsub)return;
  fb.unsub=fb.ref.onSnapshot(snap=>{
    if(!snap.exists){                 // lần đầu: tạo dữ liệu mẫu
      const s=seedData();s.users=[];
      fb.ref.set(s).catch(e=>toast('Không tạo được dữ liệu: '+e.message,'err'));
      return;
    }
    DB=normalizeDB(snap.data());
    if(!fb.shown){fb.shown=true;revealApp();}
    else softRerender();
  },err=>{
    console.error(err);
    document.getElementById('lg-err').textContent='Lỗi Firestore: '+(err.message||err.code);
    toast('Lỗi Firestore: '+(err.message||err.code),'err');
  });
}

/* ---------------- VOUCHER (Phiếu Thu / Phiếu Chi) ---------------- */
const VSTATE={receipt:{filter:'year',edit:null,sel:null},payment:{filter:'year',edit:null,sel:null}};
function vcfg(type){
  return type==='receipt'
    ? {prefix:'RVO',list:()=>DB.receipts,cats:()=>DB.incomeCat,title:'Phiếu Thu',mng:'Quản lý Phiếu Thu',
       dateLbl:'Ngày thu',catLbl:'Khoản thu',printLbl:'In phiếu thu',pos:true}
    : {prefix:'PVO',list:()=>DB.payments,cats:()=>DB.expenseCat,title:'Phiếu Chi',mng:'Quản lý Phiếu Chi',
       dateLbl:'Ngày chi',catLbl:'Khoản chi',printLbl:'In phiếu chi',pos:false};
}
function dateRange(mode){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  const iso=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1,2)+'-'+pad(dt.getDate(),2);
  if(mode==='day')return{from:iso(now),to:iso(now)};
  if(mode==='week'){const wd=(now.getDay()+6)%7;const s=new Date(y,m,d-wd),e=new Date(y,m,d-wd+6);return{from:iso(s),to:iso(e)}}
  if(mode==='month')return{from:iso(new Date(y,m,1)),to:iso(new Date(y,m+1,0))};
  if(mode==='year')return{from:y+'-01-01',to:y+'-12-31'};
  return{from:null,to:null};
}
function filteredVouchers(type){
  const st=VSTATE[type];const {from,to}=dateRange(st.filter);
  let rows=vcfg(type).list().slice();

function fmtInput(v){const n=parseMoney(v);return n?fmtMoney(n):''}
function refreshVCode(type){const st=VSTATE[type];if(st.edit)return;

  document.getElementById(type+'-code').value=nextVoucherNo(c.prefix,c.list(),d);}
function fillAddr(type){const o=objById(document.getElementById(type+'-obj').value);
  if(o)document.getElementById(type+'-addr').value=o.address||'';}
function cancelVEdit(type){VSTATE[type].edit=null;renderVEntry(type);renderVTable(type);}

function saveVoucher(type){
  const c=vcfg(type),st=VSTATE[type];
  const date=document.getElementById(type+'-date').value;
  const amount=parseMoney(document.getElementById(type+'-amount').value);
  const objId=document.getElementById(type+'-obj').value;
  const catId=document.getElementById(type+'-cat').value;
  if(!date){toast('Vui lòng chọn ngày','err');return}
  if(!amount||amount<=0){toast('Vui lòng nhập số tiền','err');return}
  if(!objId){toast('Vui lòng chọn đối tượng (Họ & Tên)','err');return}
  if(!catId){toast('Vui lòng chọn '+c.catLbl.toLowerCase(),'err');return}
  const data={
    date,amount,objId,catId,
    fundId:document.getElementById(type+'-fund').value,
    code:document.getElementById(type+'-code').value.trim(),
    reason:document.getElementById(type+'-reason').value.trim(),
    attachment:document.getElementById(type+'-att').value.trim(),
    note:document.getElementById(type+'-note').value.trim(),
  };
  const list=c.list();
  if(st.edit){const r=list.find(x=>x.id===st.edit);Object.assign(r,data);st.edit=null;toast('Đã cập nhật '+c.title,'ok');}
  else{list.push({id:uid(),createdBy:SES.fullName,createdAt:nowStamp(),...data});toast('Đã lưu '+c.title,'ok');}
  save();renderVoucher(type);
}
function editVoucher(type,id){VSTATE[type].edit=id;VSTATE[type].sel=id;
  renderVEntry(type);renderVTable(type);
  document.getElementById('v-'+ACTIVE).querySelector('.content')?.scrollTo(0,0);
  window.scrollTo(0,0);}
function deleteVoucher(type,id){
  if(!confirmBox('Xóa phiếu này? Thao tác không thể hoàn tác.'))return;
  const c=vcfg(type);const list=c.list();const i=list.findIndex(x=>x.id===id);
  if(i>=0)list.splice(i,1);
  if(VSTATE[type].edit===id)VSTATE[type].edit=null;
  save();renderVoucher(type);toast('Đã xóa phiếu','ok');
}

        <td>${esc(cat.name||'')}</td>
        <td class="num ${amtCls}">${fmtMoney(r.amount)} đ</td>

/* ---------------- MODAL helper ---------------- */
function modal(title,bodyHTML,onOk,okLabel){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="modal-h">${esc(title)}</div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f"><button class="btn sec" id="mx">Hủy</button><button class="btn" id="mo">${okLabel||'Lưu'}</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelector('#mx').onclick=close;
  bg.querySelector('.modal-bg')===bg&&bg.addEventListener('click',e=>{if(e.target===bg)close()});
  bg.querySelector('#mo').onclick=()=>{if(onOk(bg)!==false)close()};
  const first=bg.querySelector('input,select,textarea');if(first)first.focus();
  return bg;
}

function collectObj(){
  const g=k=>document.getElementById('od-'+k).value.trim();
  return {code:g('code'),name:g('name'),type:g('type'),unit:g('unit'),position:g('position'),
    address:g('address'),phone:g('phone'),email:g('email'),bankAccount:g('bankAccount'),bank:g('bank'),note:g('note')};
}
function saveObject(){
  const data=collectObj();
  if(!data.name){toast('Vui lòng nhập tên đối tượng','err');return}
  if(!data.code)data.code=(data.name.split(' ').pop()||'dt').toLowerCase().replace(/[^a-z0-9]/g,'')+Math.floor(Math.random()*90+10);
  if(OSTATE.sel==='__new__'){const id=uid();DB.objects.push({id,...data});OSTATE.sel=id;toast('Đã tạo đối tượng','ok');}
  else{Object.assign(DB.objects.find(x=>x.id===OSTATE.sel),data);toast('Đã cập nhật đối tượng','ok');}
  save();renderObjList();renderObjDetail();
}
function deleteObject(id){
  const used=DB.receipts.some(r=>r.objId===id)||DB.payments.some(p=>p.objId===id);
  if(used){toast('Không thể xóa: đối tượng đang được dùng trong phiếu','err');return}
  if(!confirmBox('Xóa đối tượng này?'))return;
  DB.objects=DB.objects.filter(o=>o.id!==id);OSTATE.sel=null;save();renderObjList();renderObjDetail();toast('Đã xóa','ok');
}

function deleteFund(id){

  const used=DB.receipts.some(r=>r.fundId===id)||DB.payments.some(p=>p.fundId===id);

  if(!confirmBox('Xóa quỹ này?'))return;
  DB.funds=DB.funds.filter(f=>f.id!==id);save();renderFunds(document.getElementById('v-'+ACTIVE));toast('Đã xóa','ok');}

/* ---------------- ĐỌC SỐ THÀNH CHỮ (tiếng Việt) ---------------- */
function docSoThanhChu(num){
  num=Math.round(Number(num)||0);
  if(num===0)return 'Không đồng';
  const chu=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  function doc3(n,full){
    let tram=Math.floor(n/100), chuc=Math.floor((n%100)/10), donvi=n%10, s='';
    if(full||tram>0){s+=chu[tram]+' trăm';
      if(chuc===0&&donvi>0)s+=' lẻ';}
    if(chuc>0){s+=(s?' ':'')+(chuc===1?'mười':chu[chuc]+' mươi');}
    if(donvi>0){
      if(chuc===0){if(tram>0||full)s+=' '+chu[donvi];else s+=chu[donvi];}
      else if(donvi===1&&chuc>1)s+=' mốt';
      else if(donvi===5)s+=' lăm';
      else s+=' '+chu[donvi];
    }
    return s.trim();
  }
  const units=['',' nghìn',' triệu',' tỷ'];
  let groups=[];let n=num;
  while(n>0){groups.unshift(n%1000);n=Math.floor(n/1000);}
  let out='';const L=groups.length;
  for(let i=0;i<L;i++){
    const g=groups[i];const pos=L-1-i;
    if(g===0){continue;}
    const full=(i>0);
    out+=(out?' ':'')+doc3(g,full)+units[pos];
  }
  out=out.trim();
  out=out.charAt(0).toUpperCase()+out.slice(1);
  return out+' đồng';
}

/* ---------------- SỔ QUỸ (Cash book) ---------------- */
function renderCashbook(el){
  const fundId=DB.funds[0]?.id;
  const fundOpts=DB.funds.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');
  el.innerHTML=`
  <div class="panel">
    <div class="panel-head"><span>SỔ QUỸ TIỀN MẶT</span>
      <span class="panel-sub">Quỹ: <select id="cb-fund" onchange="drawCashbook()" style="margin-left:4px">${fundOpts}</select></span></div>
    <div class="box tbl-wrap" id="cb-body"></div>
  </div>`;
  drawCashbook();
}
function drawCashbook(){
  const fundId=document.getElementById('cb-fund').value;
  const f=DB.funds.find(x=>x.id===fundId);
  const evts=[];
  DB.receipts.filter(r=>r.fundId===fundId).forEach(r=>evts.push({date:r.date,code:r.code,reason:r.reason,thu:r.amount,chi:0,createdAt:r.createdAt}));
  DB.payments.filter(p=>p.fundId===fundId).forEach(p=>evts.push({date:p.date,code:p.code,reason:p.reason,thu:0,chi:p.amount,createdAt:p.createdAt}));
  evts.sort((a,b)=>(a.date+(a.createdAt||'')).localeCompare(b.date+(b.createdAt||'')));
  let bal=Number(f.initialAmount||0);let totThu=0,totChi=0;
  const rows=evts.map(e=>{bal+=e.thu-e.chi;totThu+=e.thu;totChi+=e.chi;
    return `<tr>
      <td>${fmtDate(e.date)}</td><td>${esc(e.code)}</td><td>${esc(e.reason||'')}</td>
      <td class="num pos">${e.thu?fmtMoney(e.thu):''}</td>
      <td class="num neg">${e.chi?fmtMoney(e.chi):''}</td>
      <td class="num ${bal<0?'neg':''}">${fmtMoney(bal)}</td></tr>`}).join('');
  document.getElementById('cb-body').innerHTML=`
    <table class="grid"><thead><tr>
      <th>Ngày</th><th>Số phiếu</th><th>Diễn giải</th><th class="num">Thu</th><th class="num">Chi</th><th class="num">Tồn quỹ</th>
    </tr></thead><tbody>
      <tr style="font-style:italic;background:#eef7f0"><td colspan="5">Số dư đầu kỳ</td><td class="num">${fmtMoney(f.initialAmount)}</td></tr>
      ${rows||''}
      <tr style="font-weight:700;background:var(--green-l)"><td colspan="3">Cộng phát sinh</td>
        <td class="num pos">${fmtMoney(totThu)}</td><td class="num neg">${fmtMoney(totChi)}</td>
        <td class="num ${bal<0?'neg':'pos'}">${fmtMoney(bal)}</td></tr>
    </tbody></table>`;
}

/* ---------------- THỐNG KÊ ---------------- */
function renderStats(el){
  const totThu=DB.receipts.reduce((s,r)=>s+Number(r.amount||0),0);
  const totChi=DB.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const init=DB.funds.reduce((s,f)=>s+Number(f.initialAmount||0),0);
  const remain=init+totThu-totChi;
  const byCat=(list,cats)=>{const m={};list.forEach(v=>{m[v.catId]=(m[v.catId]||0)+Number(v.amount||0)});
    return cats.map(c=>({name:c.name,amt:m[c.id]||0})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt)};
  const chi=byCat(DB.payments,DB.expenseCat), thu=byCat(DB.receipts,DB.incomeCat);
  const card=(lbl,val,cls)=>`<div style="flex:1;min-width:160px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px">
    <div class="muted" style="font-size:12px">${lbl}</div><div class="${cls}" style="font-size:20px;font-weight:700;margin-top:4px">${fmtMoney(val)} đ</div></div>`;
  const bars=(arr,cls,max)=>arr.map(x=>`<div style="margin:6px 0">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(x.name)}</span><b class="${cls}">${fmtMoney(x.amt)}</b></div>
    <div style="height:8px;background:#eef2ef;border-radius:5px;overflow:hidden"><div style="height:100%;width:${max?Math.round(x.amt/max*100):0}%;background:${cls==='neg'?'var(--red)':'var(--green)'}"></div></div></div>`).join('')||'<div class="muted">Không có dữ liệu.</div>';
  el.innerHTML=`
  <div class="panel">
    <div class="panel-head"><span>THỐNG KÊ THU CHI</span></div>
    <div class="box" style="padding:16px">
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        ${card('Tồn quỹ đầu kỳ',init,'')}${card('Tổng Thu',totThu,'pos')}
        ${card('Tổng Chi',totChi,'neg')}${card('Tồn quỹ hiện tại',remain,remain<0?'neg':'pos')}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px">
        <div><h3 style="color:var(--green-d);margin:0 0 8px">Thu theo khoản</h3>${bars(thu,'pos',Math.max(1,...thu.map(x=>x.amt)))}</div>
        <div><h3 style="color:var(--red);margin:0 0 8px">Chi theo khoản</h3>${bars(chi,'neg',Math.max(1,...chi.map(x=>x.amt)))}</div>
      </div>
    </div>
  </div>`;
}
